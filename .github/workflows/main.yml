name: Build USB Raptor Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet packages
        shell: powershell
        run: |
          nuget restore "USB Raptor.vbproj"

      - name: Build project
        shell: powershell
        run: |
          msbuild "USB Raptor.vbproj" /p:Configuration=Release /p:Platform="AnyCPU"

      - name: Create ZIP
        shell: powershell
        run: |
          if (!(Test-Path ".\bin\Release")) {
            throw "Build output not found: .\bin\Release"
          }
          Compress-Archive -Path ".\bin\Release\*" -DestinationPath ".\USB-Raptor.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: USB-Raptor
          path: .\USB-Raptor.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: .\USB-Raptor.zip
